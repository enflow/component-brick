name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]
        laravel: [12.*, 13.*]

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-
            ${{ runner.os }}-composer-${{ matrix.php }}-

      - run: composer validate --strict

      - run: composer require --no-interaction --no-update illuminate/support:${{ matrix.laravel }} illuminate/routing:${{ matrix.laravel }} illuminate/database:${{ matrix.laravel }}

      - run: composer update --prefer-dist --no-interaction --no-progress
